[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SAFI-Net"
version = "0.1.0"
description = "Semantic-Guided Asynchronous Infrared–Visible Video Fusion and Interpolation"
requires-python = ">=3.10"
dependencies = ["torch>=2.7", "numpy>=2", "pillow>=11", "transformers==5.17.0", "safetensors>=0.6", "PyYAML>=6", "opencv-python-headless>=4.10", "tqdm>=4.66"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["safi_net*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
